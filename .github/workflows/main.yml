name: CI

on:
  push:
    branches: [ main ]
  pull_request:
     branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v2

    - name: PerfAction for JMeter
  # You may pin to the exact commit or the version.
  # uses: QAInsights/PerfAction@d16221318a6d261b1546b9dec9c0bb1739e3d480
      uses: QAInsights/PerfAction@v5.6.3
      with:
        # JMeter test plan to execute
        test-plan-path: './CreateLead.jmx'
        # Where to store the results e.g., result.csv
        results-file: # optional, default is result.jtl
        # Optional arguments. For more details https://jmeter.apache.org/usermanual/get-started.html#non_gui
        args: # optional

